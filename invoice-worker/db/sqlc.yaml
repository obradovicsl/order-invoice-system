version: "2"
sql:
  - queries:
      - "../internal/features/order/queries/"
    schema: "../db/migrations/"
    engine: "postgresql"
    gen:
      go:
        package: "repository"
        out: "../internal/repository"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        emit_interface: true
