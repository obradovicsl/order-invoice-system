apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  ENV: "production"
  LOG_LEVEL: "info"

  # Database
  DB_HOST: "postgres.default.svc.cluster.local"
  DB_PORT: "5432"
  DB_SSLMODE: "disable"

  # Storage
  BLOB_CONTAINER_NAME: "invoices"
  QUEUE_NAME: "invoice-queue"

  # CORS
  ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173"
